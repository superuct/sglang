name: Build cu129 wheel

# 在 fork 里按需触发，构建 +cu129 标记的 sglang wheel 并发布到 fork 自己的 Releases。
#
# 与官方 nightly 的差异：
#   1. 去掉 `github.repository == 'sgl-project/sglang'` 守卫
#   2. 用 sed 把 pyproject.toml 里的 [cu13] -> [cu12]，cuda-python>=13.0 -> >=12.0
#   3. 把 sgl-deep-gemm / sglang-kernel 的 ==X.Y.Z 改成 >=X.Y.Z，允许已装的 +cu129 版本通过
#   4. 重命名 wheel 加 +cu129 local version
#   5. 不推 sgl-project/whl，改成在 fork 自己的 Releases 上发布

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'sglang ref (tag / branch / commit)'
        required: true
        default: 'v0.4.5'
      version_label:
        description: 'local version 标签 (不带 +)'
        required: false
        default: 'cu129'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch pyproject.toml (cu13 -> cu12)
        working-directory: python
        run: |
          sed -i \
            -e 's|flashinfer_python\[cu13\]|flashinfer_python[cu12]|g' \
            -e 's|humming-kernels\[cu13\]|humming-kernels[cu12]|g' \
            -e 's|nvidia-cutlass-dsl\[cu13\]|nvidia-cutlass-dsl[cu12]|g' \
            -e 's|cuda-python>=13\.0|cuda-python>=12.0|g' \
            -e 's|"sgl-deep-gemm==0\.1\.5"|"sgl-deep-gemm>=0.1.5"|g' \
            -e 's|"sglang-kernel==0\.4\.5"|"sglang-kernel>=0.4.5"|g' \
            pyproject.toml

          echo '==== patched deps ===='
          grep -E 'flashinfer|humming|cutlass-dsl|cuda-python|sgl-deep-gemm|sglang-kernel' pyproject.toml

      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools setuptools-scm
          python -m build --wheel
          ls -lh dist/

      - name: Tag wheel with +${{ inputs.version_label }}
        id: rename
        working-directory: python/dist
        run: |
          set -euo pipefail
          WHEEL=$(ls sglang-*.whl | head -n1)
          LABEL='${{ inputs.version_label }}'
          # sglang-0.4.5-py3-none-any.whl -> sglang-0.4.5+cu129-py3-none-any.whl
          NEW=$(printf '%s' "$WHEEL" | sed -E "s|^(sglang-[0-9]+\.[0-9]+\.[0-9]+[^-]*)-|\1+${LABEL}-|")
          mv "$WHEEL" "$NEW"
          echo "renamed=$NEW" >> "$GITHUB_OUTPUT"
          ls -lh "$NEW"

      - name: Resolve version
        id: ver
        run: |
          W='${{ steps.rename.outputs.renamed }}'
          # sglang-0.4.5+cu129-py3-none-any.whl -> 0.4.5+cu129
          V=$(printf '%s' "$W" | sed -E 's|^sglang-(.*)-py3-none-any\.whl$|\1|')
          printf 'version=%s\n' "$V" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sglang-v${{ steps.ver.outputs.version }}
          name: sglang ${{ steps.ver.outputs.version }}
          body: |
            sglang wheel built from `${{ inputs.ref }}` with cu12 dependency patches.

            ## Install

            ```bash
            # 假设已装好 cu129 版本的 sgl-kernel / sgl-deep-gemm / flashinfer / 等
            # --no-deps 关键：保护已装的 +cu129 kernels 不被 PyPI cu130 版本覆盖
            pip install --no-deps --force-reinstall sglang-${{ steps.ver.outputs.version }}-py3-none-any.whl
            ```

            ## 改了哪些依赖

            - `flashinfer_python[cu13]` → `[cu12]`
            - `humming-kernels[cu13]` → `[cu12]`
            - `nvidia-cutlass-dsl[cu13]` → `[cu12]`
            - `cuda-python>=13.0` → `cuda-python>=12.0`
            - `sgl-deep-gemm==0.1.5` → `>=0.1.5` (允许 +cu129)
            - `sglang-kernel==0.4.5` → `>=0.4.5` (允许 +cu129)
          files: python/dist/${{ steps.rename.outputs.renamed }}
          fail_on_unmatched_files: true
          make_latest: false
