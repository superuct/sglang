name: Build cu129 Qwen3.5 EAGLE3 fix wheel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-eagle3-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: 45f24e3b3d46abe051a409be9b47ba8f739d9e2d
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SGLANG: 0.5.18.post1+cu129.eagle3fix
    steps:
      - uses: actions/checkout@v4
        with:
          repository: superuct/sglang
          ref: 45f24e3b3d46abe051a409be9b47ba8f739d9e2d
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and run regression tests
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
          python scripts/local/test_qwen35_eagle3_backport.py
          git diff --check
      - name: Patch CUDA dependencies
        working-directory: python
        run: |
          sed -i \
            -e 's|flashinfer_python\[cu13\]|flashinfer_python[cu12]|g' \
            -e 's|humming-kernels\[cu13\]|humming-kernels[cu12]|g' \
            -e 's|nvidia-cutlass-dsl\[cu13\]==|nvidia-cutlass-dsl==|g' \
            -e 's|cuda-python>=13\.0|cuda-python>=12.0|g' \
            -e 's|"sgl-deep-gemm==[^"]*"|"sgl-deep-gemm>=0.0"|g' \
            -e 's|"sglang-kernel==[^"]*"|"sglang-kernel>=0.0"|g' \
            pyproject.toml
          if grep -Eni 'cu13|cuda[-_ ]?python[^"[:space:]]*[<>=!~ ]+13' pyproject.toml; then
            echo 'CUDA 13 dependency constraint remains'
            exit 1
          fi
      - name: Install protoc
        run: sudo bash scripts/ci/utils/install_protoc.sh
      - name: Build wheel with consistent package metadata
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools setuptools-scm
          python -m build --wheel
      - name: Verify wheel contents and metadata
        run: |
          python - <<'PY'
          import ast, email, os, pathlib, zipfile
          wheels = list(pathlib.Path('python/dist').glob('sglang-*.whl'))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          expected = os.environ['SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SGLANG']
          assert wheel.name.startswith(f'sglang-{expected}-'), wheel
          with zipfile.ZipFile(wheel) as z:
              metadata = email.message_from_bytes(z.read(next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))))
              assert metadata['Version'] == expected, metadata['Version']
              assert not any('cu13' in r.lower() for r in metadata.get_all('Requires-Dist', []))
              src = z.read('sglang/srt/model_executor/runner/prefill_cuda_graph_runner.py').decode()
              assert '_use_draft_input_embeds' in src
              assert '"input_embeds": static_forward_batch.input_embeds' in src
              ast.parse(src)
              src = z.read('sglang/srt/models/qwen3_5.py').decode()
              cls = next(n for n in ast.parse(src).body if isinstance(n, ast.ClassDef) and n.name == 'Qwen3_5ForCausalLM')
              assert any(isinstance(n, ast.FunctionDef) and n.name == 'set_eagle3_layers_to_capture' for n in cls.body)
              assert expected in z.read('sglang/_version.py').decode()
          print('Verified:', wheel.name, 'source:', os.environ['SOURCE_SHA'])
          PY
          cd python/dist
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sglang-cu129-eagle3fix
          path: |
            python/dist/*.whl
            python/dist/SHA256SUMS
          if-no-files-found: error
