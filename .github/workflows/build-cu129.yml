name: Build cu129 wheel

# 在 fork 里自动跟踪上游 sgl-project/sglang 的 stable tag。
# - schedule: 每天 06:17 UTC 检查上游最新 stable tag
# - workflow_dispatch: 手动触发，可指定 ref
# 触发后: checkout 上游 → patch cu13→cu12 → 装 protoc → 构建 wheel →
#         创建对应版本的 Release（保留历史版本）

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'sglang ref (tag/branch/commit)。默认: 上游最新 stable tag'
        required: false
        default: ''
      force:
        description: '强制重建 (即使 Release 已存在)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve sglang ref
        id: resolve_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_REF='${{ inputs.ref }}'
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            # 上游所有 tag -> 过滤 stable X.Y.Z -> 版本排序 -> 取最高
            REF=$(gh api repos/sgl-project/sglang/tags --paginate --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1)
            if [ -z "$REF" ]; then
              echo "Failed to fetch latest stable tag from sgl-project/sglang"
              exit 1
            fi
          fi
          echo "Resolved ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF='${{ steps.resolve_ref.outputs.ref }}'
          FORCE='${{ inputs.force || 'false' }}'
          VER="${REF#v}"
          TAG="sglang-v${VER}+cu129"
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist, will build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout sglang at ${{ steps.resolve_ref.outputs.ref }}
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: ${{ steps.resolve_ref.outputs.ref }}
          fetch-depth: 1

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch pyproject.toml (cu13 -> cu12, allow +cu129 local versions)
        if: steps.check.outputs.skip != 'true'
        working-directory: python
        run: |
          sed -i \
            -e 's|flashinfer_python\[cu13\]|flashinfer_python[cu12]|g' \
            -e 's|humming-kernels\[cu13\]|humming-kernels[cu12]|g' \
            -e 's|nvidia-cutlass-dsl\[cu13\]==|nvidia-cutlass-dsl==|g' \
            -e 's|cuda-python>=13\.0|cuda-python>=12.0|g' \
            -e 's|"sgl-deep-gemm==[^"]*"|"sgl-deep-gemm>=0.0"|g' \
            -e 's|"sglang-kernel==[^"]*"|"sglang-kernel>=0.0"|g' \
            pyproject.toml

          echo '==== patched deps ===='
          grep -E 'flashinfer|humming|cutlass-dsl|cuda-python|sgl-deep-gemm|sglang-kernel' pyproject.toml | head -10

          # Upstream dependency names can change between releases. Do not publish a
          # cu129-labelled wheel if the resulting metadata still requires CUDA 13.
          if grep -Eni 'cu13|cuda[-_ ]?python[^"[:space:]]*[<>=!~ ]+13' pyproject.toml; then
            echo 'CUDA 13 dependency constraint remains after cu129 patching'
            exit 1
          fi

      - name: Install protoc (for rust/sglang-grpc)
        if: steps.check.outputs.skip != 'true'
        run: sudo bash scripts/ci/utils/install_protoc.sh

      - name: Build wheel
        if: steps.check.outputs.skip != 'true'
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools setuptools-scm
          python -m build --wheel
          ls -lh dist/

      - name: Tag wheel with +cu129
        if: steps.check.outputs.skip != 'true'
        id: rename
        working-directory: python/dist
        run: |
          set -euo pipefail
          WHEEL=$(ls sglang-*.whl | head -n1)
          # Handles both:
          #   sglang-VERSION-py3-none-any.whl
          #   sglang-VERSION-cp312-cp312-linux_x86_64.whl
          NEW=$(printf '%s' "$WHEEL" | sed -E 's|^(sglang-[0-9]+\.[0-9]+\.[0-9]+)-|\1+cu129-|')
          mv "$WHEEL" "$NEW"
          echo "renamed=$NEW" >> "$GITHUB_OUTPUT"
          ls -lh "$NEW"

      - name: Resolve version
        if: steps.check.outputs.skip != 'true'
        id: ver
        run: |
          W='${{ steps.rename.outputs.renamed }}'
          # Strip sglang- prefix, .whl suffix, then take everything before -cp / -py tag
          V=$(printf '%s' "$W" | sed -E 's|^sglang-||; s|\.whl$||; s|-cp[0-9]+.*||; s|-py3.*||')
          printf 'version=%s\n' "$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sglang-v${{ steps.ver.outputs.version }}
          name: sglang ${{ steps.ver.outputs.version }}
          body: |
            sglang wheel built from upstream `${{ steps.resolve_ref.outputs.ref }}` with cu12 dependency patches.

            `sgl-deep-gemm` and `sglang-kernel` use upstream official cu129 wheels — not rebuilt here.

            ## Install

            ```bash
            # Pre-install cu129 essentials (one-time):
            pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu129
            pip install sglang-kernel --index-url https://docs.sglang.ai/whl/cu129/
            pip install sgl-deep-gemm --index-url https://docs.sglang.ai/whl/cu129/ --no-deps

            # Install this sglang wheel (pip resolves remaining deps from PyPI):
            pip install \
                --extra-index-url https://download.pytorch.org/whl/cu129 \
                --extra-index-url https://docs.sglang.ai/whl/cu129 \
                sglang-${{ steps.ver.outputs.version }}-*.whl
            ```
          files: python/dist/${{ steps.rename.outputs.renamed }}
          fail_on_unmatched_files: true
          make_latest: true
